name: Cargo CI

on:
  push:
    branches:
      - "main"
      - "v*.*"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  fmt:

    name: rustfmt
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # the tree is rustfmt-clean, so a commit that skips `cargo fmt` fails here
    - name: Check the formatting
      run: cargo fmt --check

  build:

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
          # arm64 Linux, the image the C repository's Docker job builds on
          - name: linux-aarch64
            os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            bin_ext: ""
          # The Windows leg is cross-compiled on a Linux image rather than run on a Windows one:
          # mingw-w64, NASM and wine all come from apt, so the job cannot be delayed by an image
          # that keeps its compiler off PATH. Its tests run under wine, which checks the code and not
          # the platform, so a behaviour that belongs to a real Windows host shows up only on a
          # machine. Darwin is absent from every push for the opposite reason: a cross-built Mach-O
          # can be neither run nor tested here, so it keeps a macos-26 runner in the release job.
          - name: windows-x86_64
            os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            bin_ext: .exe

    steps:
    - uses: actions/checkout@v6

    # `aws-lc-sys` (russh's default crypto backend) and `ring` (sqlx's) compile C, and the first
    # assembles its Windows x86_64 crypto with NASM, so the cross target needs both in front of
    # `cargo`. The standard library for the target is not installed either.
    - name: Set up the build tools (Windows)
      if: matrix.target == 'x86_64-pc-windows-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 nasm wine64

        # Debian splits the launcher: `wine` is a package of its own and only `wine64` is
        # guaranteed here, so the job names whichever of the two the image actually offers.
        wine="$(command -v wine 2>/dev/null || command -v wine64 2>/dev/null || true)"
        if [ -z "${wine}" ]; then
        	echo "no wine on this runner after installing it" >&2
        	ls /usr/bin/wine* || true
        	exit 1
        fi

        {
        	echo "WINEBIN=${wine}"
        	echo "WINEPREFIX=${RUNNER_TEMP}/wine"
        	echo "WINEDEBUG=-all"
        	echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER=${wine}"
        } >> "$GITHUB_ENV"

        x86_64-w64-mingw32-gcc --version | head -n 1
        nasm -v
        rustup target add x86_64-pc-windows-gnu

        # An empty prefix makes the first run write its own, which is a minute of log output the
        # suite does not need; wineboot builds it once here instead.
        "${wine}" wineboot --init

    - name: Show the toolchain
      shell: bash
      run: |
        rustc -vV
        cargo -V
        cc --version 2>/dev/null | head -n 1 || gcc --version | head -n 1

    - name: Build
      shell: bash
      run: cargo build --all-targets --locked --target ${{ matrix.target }}

    # the article-cache fixtures hold the bytes C's `strftime("%c %Z")` wrote on a China Standard
    # Time host, so the byte-for-byte check needs that zone; a runner defaults to UTC. The fixtures
    # are read by a Unix-only test, and the Windows cargo variables above are inert on the other
    # two legs.
    - name: Test
      env:
        TZ: Asia/Shanghai
      shell: bash
      run: cargo test --locked --target ${{ matrix.target }}

    # bbsd answers -v before it looks for a server root, which is all a runner can offer
    - name: Run the binary
      shell: bash
      run: |
        # arg_version() writes to stderr, as C's did
        bin="target/${{ matrix.target }}/debug/bbsd${{ matrix.bin_ext }}"
        if [ -n "${{ matrix.bin_ext }}" ]; then
        	"${WINEBIN}" "${bin}" -v
        else
        	"${bin}" -v
        fi

    # `make install` is shell, so it is exercised here against the debug build instead of a second
    # (release) build; a staged DESTDIR keeps the check out of /usr/local and off /etc
    - name: Check the install target
      if: matrix.bin_ext == ''
      shell: bash
      run: |
        stage="${RUNNER_TEMP}/stage"
        utils/install.sh --bin-dir "target/${{ matrix.target }}/debug" \
        	--prefix /usr/local/lbbs --destdir "${stage}" \
        	--systemd-dir /etc/systemd/system --logrotate-dir /etc/logrotate.d
        test -x "${stage}/usr/local/lbbs/bin/bbsd"
        test -d "${stage}/usr/local/lbbs/var/gen_ex"
        test -f "${stage}/usr/local/lbbs/conf/lbbs.service"
        test -f "${stage}/etc/systemd/system/lbbs.service"
        test -f "${stage}/etc/logrotate.d/lbbs"
        grep -qx 'ExecStart=/usr/local/lbbs/bin/bbsd -f' "${stage}/etc/systemd/system/lbbs.service"
        utils/install.sh --uninstall --prefix /usr/local/lbbs --destdir "${stage}" \
        	--systemd-dir /etc/systemd/system --logrotate-dir /etc/logrotate.d
        test ! -e "${stage}/usr/local/lbbs/bin/bbsd"
        test ! -e "${stage}/etc/systemd/system/lbbs.service"
