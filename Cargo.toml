[package]
name = "lbbs"
version = "0.1.0"
edition = "2024"

# The daemon is named `bbsd`, the way the C server is, so it installs into the same bin/ path.
autobins = false
default-run = "bbsd"

[[bin]]
name = "bbsd"
path = "src/main.rs"

[[bin]]
name = "gen_top"
path = "src/bin/gen_top.rs"

[[bin]]
name = "gen_section_menu"
path = "src/bin/gen_section_menu.rs"

[[bin]]
name = "gen_ex_list"
path = "src/bin/gen_ex_list.rs"

[dependencies]
chrono = "0.4.45"
encoding_rs = "0.8.44"
futures-util = "0.3.34"
regex = "1.13.2"
russh = "0.65.2"
# Only used directly by `bbsnet`'s outbound-site socket; already in the tree through `tokio`.
socket2 = "0.6.5"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql", "chrono", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
tracing = "0.1.44"
unicode-width = "0.2.3"

# Every remaining `libc` call site is inside a `cfg(unix)` block: the daemonising of `daemon`, the
# `strftime` of the cache header, and the locale check that only `strftime` needs.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
